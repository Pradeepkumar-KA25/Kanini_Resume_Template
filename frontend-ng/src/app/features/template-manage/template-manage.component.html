<section class="manage" aria-labelledby="manage-title"><header><h1 id="manage-title">Manage Template</h1><p>{{ template.display_name }}</p></header>@if (error()) { <p class="error" role="alert">{{ error() }}</p> } @if (confirmDelete()) { <div class="confirm"><h2>Delete Template?</h2><p>This template will be permanently removed.</p><button type="button" class="secondary" (click)="closed.emit()">Cancel</button><button type="button" class="danger" [disabled]="busy()" (click)="remove()">{{ busy() ? 'Deleting...' : 'Delete Template' }}</button></div> } @else if (detail()) { <div class="form"><label>Template Name<input [(ngModel)]="name" maxlength="80" [disabled]="busy()" /></label><label>Description<textarea [(ngModel)]="description" maxlength="240" [disabled]="busy()"></textarea></label><label>Page Size<select [(ngModel)]="spec.page.size" [disabled]="busy()"><option value="A4">A4</option><option value="LETTER">Letter</option></select></label><label>Font<select [(ngModel)]="spec.typography.font_family" [disabled]="busy()"><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Helvetica</option><option>Times New Roman</option></select></label><label>Columns<select [(ngModel)]="spec.layout.columns" [disabled]="busy()"><option [ngValue]="1">Single column</option><option [ngValue]="2">Two columns</option></select></label>@if (regeneratedPreview()) { <iframe [attr.srcdoc]="regeneratedPreview()" sandbox="" title="Regenerated template preview"></iframe><button type="button" class="primary" [disabled]="busy()" (click)="confirmRegeneration()">Apply Regenerated Template</button><button type="button" class="secondary" (click)="cancelRegeneration()">Cancel Regeneration</button> } @else { <div><button type="button" class="secondary" (click)="closed.emit()">Cancel</button><button type="button" class="primary" [disabled]="busy()" (click)="save()">{{ busy() ? 'Saving...' : 'Save Changes' }}</button></div> }</div> }</section>
